plugins {
    id 'com.android.application'
}

android {
    namespace 'space.pengtao.ledger'
    compileSdk 34

    defaultConfig {
        applicationId "space.pengtao.ledger"
        minSdk 24
        targetSdk 34
        versionCode 38
        versionName "2.4.8"
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug 签名，assembleRelease 直接出可安装 APK。
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
